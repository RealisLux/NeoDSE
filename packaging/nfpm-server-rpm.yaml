# NeoDSE - Enterprise Linux amd64 server package definition.
name: neodse-server
arch: amd64
platform: linux
version: ${VERSION}
maintainer: "RealisLux <realislux@users.noreply.github.com>"
description: NeoDSE controller, WebSocket transport, and explicit proxy with SELinux policy
license: MIT
depends: [ca-certificates, iproute, systemd, wireguard-tools, policycoreutils, shadow-utils]
contents:
  - src: build/neodse-server-notices.txt
    dst: /usr/share/licenses/neodse-server/THIRD-PARTY-NOTICES
    file_info: { mode: 0644, owner: root, group: root }
  - src: LICENSE
    dst: /usr/share/licenses/neodse-server/LICENSE
    file_info: { mode: 0644, owner: root, group: root }
  - src: NOTICE
    dst: /usr/share/licenses/neodse-server/NOTICE
    file_info: { mode: 0644, owner: root, group: root }
  - dst: /etc/neodse
    type: dir
    file_info: { mode: 0755, owner: root, group: root }
  - dst: /var/lib/neodse
    type: dir
    file_info: { mode: 0700, owner: neodse-server, group: neodse-server }
  - src: build/neodse-server
    dst: /usr/bin/neodse-server
    file_info: { mode: 0755 }
  - src: build/neodse-transport
    dst: /usr/bin/neodse-transport
    file_info: { mode: 0755 }
  - src: build/neodse-proxy
    dst: /usr/bin/neodse-proxy
    file_info: { mode: 0755 }
  - src: systemd/neodse-server.service
    dst: /usr/lib/systemd/system/neodse-server.service
  - src: systemd/neodse-proxy.service
    dst: /usr/lib/systemd/system/neodse-proxy.service
  - src: systemd/neodse-transport.service
    dst: /usr/lib/systemd/system/neodse-transport.service
  - src: build/selinux/neodse.pp
    dst: /usr/share/selinux/packages/neodse.pp
scripts:
  preinstall: scripts/preinstall-server.sh
  postinstall: scripts/postinstall-server.sh
  preremove: scripts/preremove-server.sh
  postremove: scripts/postremove-server.sh
