# NeoDSE VNC authentication authority runtime directory.
# The agent owns the directory; members of neodse-ipc may only traverse it to
# connect to the explicitly permissioned Unix socket.
d /run/neodse-vnc-auth 0750 neodse-agent neodse-ipc -
# Keep the shared NeoDSE IPC directory available to the agent even when
# Weston and the UI are skipped on a headless boot. The IPC group may traverse
# it to connect to sockets, but must not replace sockets or Weston configuration.
d /run/neodse 0750 neodse-ui neodse-ipc -
