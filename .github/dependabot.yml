version: 2
updates:
  # Runtime dependencies stay weekly. Tool upgrades follow upstream graphs;
  # allow lists restrict update PRs, not dependency-graph vulnerability alerts.
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-dependencies: { patterns: ['*'] }
  - package-ecosystem: gomod
    directory: /tools/analysis
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/rhysd/actionlint
      - dependency-name: golang.org/x/vuln
      - dependency-name: honnef.co/go/tools
    groups:
      analysis-tools: { patterns: ['*'] }
  - package-ecosystem: gomod
    directory: /tools/security
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/securego/gosec/v2
    groups:
      security-tools: { patterns: ['*'] }
  - package-ecosystem: gomod
    directory: /tools/packaging
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/goreleaser/nfpm/v2
    groups:
      packaging-tools: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /tools/sbom
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/anchore/syft
      - dependency-name: github.com/anchore/grype
    groups:
      sbom-tools: { patterns: ['*'] }
