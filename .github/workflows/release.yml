name: Package and release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  SYFT_CHECK_FOR_APP_UPDATE: false
  GRYPE_CHECK_FOR_APP_UPDATE: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Verify release tag identity and signature
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          # Stable tags are production releases and must be cut from main.
          # Pre-release tags (for example v1.2.3-dev.1) are published from dev.
          release_version="${GITHUB_REF_NAME#v}"
          python3 scripts/check-release-assets.py --version "${release_version}" --list-packages >/dev/null
          release_core="${release_version%%+*}"
          if [[ "${release_core}" == *-* ]]; then
            release_branch=dev
            release_kind=development
          else
            release_branch=main
            release_kind=production
          fi

          git fetch --no-tags origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          release_commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
          branch_commit=$(git rev-parse --verify "refs/remotes/origin/${release_branch}^{commit}")
          if [[ "${release_commit}" != "${branch_commit}" ]]; then
            echo "::error::The ${release_kind} tag must point directly to the current ${release_branch} commit."
            exit 1
          fi

          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq 'select(.object.type == "tag") | .object.sha')
          if [[ -z "${tag_object}" ]]; then
            echo "::error::The ${release_kind} tag must be an annotated, cryptographically signed tag."
            exit 1
          fi

          verified_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq 'select(.object.type == "commit" and .verification.verified == true) | .object.sha')
          if [[ "${verified_commit}" != "${release_commit}" ]]; then
            echo '::error::GitHub must verify the tag signature, and the tag must point directly to the release commit.'
            exit 1
          fi

  packages:
    needs: [release-policy, quality-gate, codeql]
    # A private personal repository skips CodeQL; public packages require it.
    if: >-
      !cancelled() && needs.release-policy.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (needs.codeql.result == 'success' ||
       (github.event.repository.private && needs.codeql.result == 'skipped'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian13, image: 'debian:13@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1', runner: ubuntu-26.04, arch: amd64, component: client, format: deb }
          - { target: debian13, image: 'debian:13@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1', runner: ubuntu-26.04-arm, arch: arm64, component: client, format: deb }
          - { target: debian13, image: 'debian:13@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1', runner: ubuntu-26.04, arch: amd64, component: server, format: deb }
          - { target: debian13, image: 'debian:13@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1', runner: ubuntu-26.04-arm, arch: arm64, component: server, format: deb }
          - { target: ubuntu26.04, image: 'ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b', runner: ubuntu-26.04, arch: amd64, component: client, format: deb }
          - { target: ubuntu26.04, image: 'ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b', runner: ubuntu-26.04-arm, arch: arm64, component: client, format: deb }
          - { target: ubuntu26.04, image: 'ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b', runner: ubuntu-26.04, arch: amd64, component: server, format: deb }
          - { target: ubuntu26.04, image: 'ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b', runner: ubuntu-26.04-arm, arch: arm64, component: server, format: deb }
          - { target: el9, image: 'rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f', runner: ubuntu-26.04, arch: amd64, component: server, format: rpm }
          - { target: el10, image: 'rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834', runner: ubuntu-26.04, arch: amd64, component: server, format: rpm }
    steps:
      - name: Preserve container system command paths
        shell: /bin/sh -e {0}
        run: |
          # Actions may rebuild PATH when adding tool-cache directories.
          # Keep the container's system tools available to nested scripts too.
          printf '%s\n' /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin >> "${GITHUB_PATH}"
      - name: Install DEB build prerequisites
        if: matrix.format == 'deb'
        shell: /bin/sh -e {0}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates curl git make gcc binutils file python3 pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libjson-glib-dev
      - name: Install RPM build prerequisites
        if: matrix.format == 'rpm'
        shell: /bin/sh -e {0}
        run: dnf install -y bash git-core ca-certificates curl-minimal make tar gzip binutils file python3 bsdtar shadow-utils selinux-policy-devel policycoreutils-devel rpm && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Configure container Git trust and verify checkout
        run: |
          # Checkout's temporary HOME can differ from subsequent container steps.
          # Trust only this workspace in the disposable build container.
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" status --porcelain
          git -C "${GITHUB_WORKSPACE}" rev-parse --verify HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          # Published binaries are built from a fresh module and build cache.
          cache: false
      - name: Select version and asset name
        id: asset
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          extension="${{ matrix.format }}"
          name="NeoDSE-${{ matrix.component }}_${version}_${{ matrix.target }}_${{ matrix.arch }}.${extension}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Build native package using the shared builder
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          bash scripts/build-local-packages.sh --skip-tests \
            --version "${{ steps.asset.outputs.version }}" \
            --component "${{ matrix.component }}" --format "${{ matrix.format }}" \
            --target "${{ matrix.target }}"
          test -f "dist/${{ steps.asset.outputs.name }}"
      - name: Test package install, reinstall and removal (no live services)
        run: |
          # Preserve the original failure and print apt's detailed error context.
          trap 'status=$?; if [[ -f /var/log/apt/term.log ]]; then tail -n 200 /var/log/apt/term.log; fi; exit "${status}"' ERR
          package="dist/${{ steps.asset.outputs.name }}"
          if [[ "${{ matrix.format }}" == deb ]]; then
            apt-get install -y "./${package}"
            apt-get install -y --reinstall "./${package}"
            dpkg --verify "neodse-${{ matrix.component }}"
            dpkg --purge "neodse-${{ matrix.component }}"
            if dpkg-query --show "neodse-${{ matrix.component }}" >/dev/null 2>&1; then
              exit 1
            fi
          else
            dnf install -y "./${package}"
            dnf reinstall -y "./${package}"
            rpm --verify neodse-server
            rpm --erase neodse-server
            if rpm --query neodse-server >/dev/null 2>&1; then
              exit 1
            fi
          fi
      - name: Verify binary hardening and version metadata
        run: |
          case "${{ matrix.component }}" in
            client) binaries=(build/neodse-agent build/neodse-ui build/neodse-vnc-auth) ;;
            server) binaries=(build/neodse-server build/neodse-transport build/neodse-proxy) ;;
            *) echo 'Unknown package component' >&2; exit 1 ;;
          esac
          for binary in "${binaries[@]}"; do
            test -x "${binary}"
            file "${binary}"
            readelf -W -h "${binary}" | grep 'Type:.*DYN' > /dev/null
            readelf -W -l "${binary}" | grep GNU_RELRO > /dev/null
            readelf -W -l "${binary}" | grep 'GNU_STACK.*RW ' > /dev/null
            if [[ "${binary}" == *neodse-ui ]]; then
              readelf -W -s "${binary}" | grep __stack_chk_fail > /dev/null
            fi
            "${binary}" --version | grep -F "${{ steps.asset.outputs.version }}"
          done
      - name: Extract package payload for binary dependency discovery
        run: bash scripts/stage-package-sbom.sh build/package-sbom "dist/${{ steps.asset.outputs.name }}"
      - name: Build pinned release scanners
        run: make sbom-tools
      - name: Generate package SBOM
        run: |
          read -r package_sha256 _ < <(sha256sum "dist/${{ steps.asset.outputs.name }}")
          build/tools/syft scan dir:build/package-sbom --source-name "sha256:${package_sha256}" \
            -o "spdx-json=dist/${{ steps.asset.outputs.name }}.spdx.json"
      - name: Verify SBOM covers embedded Go dependencies
        run: python3 scripts/check-package-sbom.py build/package-sbom "dist/${{ steps.asset.outputs.name }}.spdx.json"
      - name: Scan package SBOM for high-severity vulnerabilities
        run: |
          case "${{ matrix.target }}" in
            debian13) distro=debian:13 ;;
            ubuntu26.04) distro=ubuntu:26.04 ;;
            el9) distro=rocky:9 ;;
            el10) distro=rocky:10 ;;
            *) echo 'Unsupported scanner distribution' >&2; exit 1 ;;
          esac
          build/tools/grype "sbom:dist/${{ steps.asset.outputs.name }}.spdx.json" \
            --distro "${distro}" --fail-on high --output json \
            --file "dist/${{ steps.asset.outputs.name }}.vulnerabilities.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-${{ steps.asset.outputs.version }}-${{ matrix.component }}-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  quality-gate:
    needs: release-policy
    uses: ./.github/workflows/quality.yml

  codeql:
    needs: release-policy
    if: github.event.repository.private == false
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  publish:
    # Release visibility follows the repository; evidence is required in both modes.
    if: >-
      !cancelled() && github.ref_type == 'tag' &&
      needs.release-policy.result == 'success' && needs.packages.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (needs.codeql.result == 'success' ||
       (github.event.repository.private && needs.codeql.result == 'skipped'))
    needs: [release-policy, packages, quality-gate, codeql]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify per-package artifacts and checksums
        run: python3 scripts/check-release-assets.py release-assets --version "${GITHUB_REF_NAME#v}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # GitHub does not support attestations for private personal repositories.
        if: github.event.repository.private == false
        with:
          subject-path: |
            release-assets/*.deb
            release-assets/*.rpm
      - name: Create the release checksum manifest
        working-directory: release-assets
        run: sha256sum ./*.deb ./*.rpm ./*.sha256 > SHA256SUMS
      - name: Publish release after every asset is present
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
