name: Tooling maintenance

# Keep these checks visible and failing on findings, independently of releases.
# Do not require this workflow in the product branch ruleset.
on:
  pull_request:
  push:
    branches: [main, dev]
    paths:
      - 'tools/**'
      - 'Makefile'
      - 'scripts/check-tool-vulnerabilities.sh'
      - 'scripts/check-scanner-vulnerabilities.py'
      - '.github/workflows/tooling.yml'
      - '.github/dependabot.yml'
  schedule:
    - cron: '35 10 * * 6'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # The dependency-review API is unavailable to private personal repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          license-check: true
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5

  tool-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: true
          cache-dependency-path: tools/*/go.sum
      - name: Verify tool module integrity and tidy state
        run: make verify-tool-modules 2>&1 | tee tool-modules.log
      - name: Audit pinned tool sources and binaries
        run: make verify-tool-vulnerabilities 2>&1 | tee tool-audit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-audit
          path: |
            tool-modules.log
            tool-audit.log
            build/tool-audit/
          retention-days: 90
