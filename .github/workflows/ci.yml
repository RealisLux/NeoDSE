name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '5 10 * * 6'
  workflow_dispatch:
    inputs:
      full-integration:
        description: Run both ten-minute fleet soaks
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      full-integration: ${{ github.event_name == 'schedule' || inputs.full-integration == true }}

  dependency-review:
    # The dependency-review API is unavailable to private personal repositories.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          license-check: true
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5

  scheduled-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Extended security-boundary fuzzing
        run: make fuzz-smoke FUZZ_TIME=5m
