name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '5 10 * * 6'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  scheduled-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      - name: Extended security-boundary fuzzing
        run: make fuzz-smoke FUZZ_TIME=5m
