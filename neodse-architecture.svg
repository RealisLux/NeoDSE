<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="1500" viewBox="0 0 2100 750" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">NeoDSE architecture</title>
<desc id="architecture-desc">Operator tools connect to a self-hosted controller. Display hosts initiate the WireGuard UDP tunnel to the controller. The full-height green tunnel box contains the blue WebSocket transport and purple content-proxy traffic. Dashed arrows identify traffic carried inside encrypted WireGuard UDP packets; local connections use solid arrows. Controller services communicate with Linux display agents through this tunnel; agents render web content and control displays and peripherals. Weston captures its output through a local TLS-protected VNC server. The agent converts captured frames to JPEG and returns them through the transport and controller to the operator over HTTPS. A one-use PAM credential authenticates local capture; no keyboard or mouse input is forwarded.</desc>
