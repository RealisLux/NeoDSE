# Match the existing Staticcheck and production-only gosec checks.
version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - staticcheck
    - unused
    - gosec
  settings:
    staticcheck:
      # Preserve standalone Staticcheck defaults; QF suggestions are opt-in there.
      checks: [all, '-ST1000', '-ST1003', '-ST1016', '-ST1020', '-ST1021', '-ST1022', '-QF*']
  exclusions:
    # Do not apply golangci-lint's default false-positive exclusion presets.
    presets: []
    rules:
      - path: '_test\.go$'
        linters: [gosec]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
